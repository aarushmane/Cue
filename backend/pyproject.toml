[project]
name = "storeguide-backend"
version = "0.1.0"
description = "FastAPI voice WebSocket server for StoreGuide"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
