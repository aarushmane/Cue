[project]
name = "storeguide-backend"
version = "0.1.0"
description = "Read-only FastAPI server for StoreGuide's existing Supabase database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7,<0.8",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-anthropic>=1.7,<2",
    "pydantic-settings>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
